version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: user-team-postgres
    environment:
      POSTGRES_DB: userteamdb
      POSTGRES_USER: resolve
      POSTGRES_PASSWORD: resolve123
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: